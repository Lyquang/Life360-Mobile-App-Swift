schema_version: "1.0"
preset:
  id: "familytracker-mobile"
  name: "FamilyTracker Mobile Engineering"
  version: "1.0.0"
  description: "iOS MVVM-C, API contracts, approval, reuse, verification and study"
requires:
  speckit_version: "==1.4.0"
provides:
  templates:
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      strategy: "prepend"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      strategy: "prepend"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      strategy: "prepend"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      strategy: "append"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      strategy: "append"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      strategy: "prepend"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      strategy: "append"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      strategy: "prepend"
