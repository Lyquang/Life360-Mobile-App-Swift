name: FamilyTracker
options:
  bundleIdPrefix: com.lyq02
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  Pulse:
    url: https://github.com/kean/Pulse
    exactVersion: 5.2.3
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0
targets:
  FamilyTracker:
    type: application
    platform: iOS
    sources:
      - path: FamilyTracker
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyq02.familytracker
        DEVELOPMENT_TEAM: PU3SV9A55A
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: FamilyTracker/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: SocketIO
      - package: Pulse
        product: Pulse
      - package: Pulse
        product: PulseUI
