name: Code Quality

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "study/**"
      - "api-docs/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: SwiftLint & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/swiftlint.zip"
          install_dir="$RUNNER_TEMP/swiftlint"
          curl --fail --silent --show-error --location \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" \
            --output "$archive"
          echo "${SWIFTLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          swiftlint_bin="$(find "$install_dir" -type f -name swiftlint -print -quit)"
          test -n "$swiftlint_bin"
          chmod +x "$swiftlint_bin"
          "$swiftlint_bin" version
          "$swiftlint_bin" lint --no-cache

      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" git --redact=100 --no-banner --verbose .

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## FamilyTracker code quality"
            echo ""
            echo "- Result: **${{ job.status }}**"
            echo "- SwiftLint: \`${SWIFTLINT_VERSION}\` (non-strict baseline)"
            echo "- Gitleaks: \`${GITLEAKS_VERSION}\` (full Git history)"
          } >> "$GITHUB_STEP_SUMMARY"
